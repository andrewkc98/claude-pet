name: ClaudePet
options:
  bundleIdPrefix: com.andrewtucker
  deploymentTarget:
    macOS: "13.0"
targets:
  ClaudePet:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClaudePet
      - path: Assets/cat_idle.png
        buildPhase: resources
      - path: Assets/cat_jump.png
        buildPhase: resources
      - path: Assets/cat_sleep_v2_calm.png
        buildPhase: resources
      - path: Assets/cat_wake.png
        buildPhase: resources
      - path: Assets/cat_alert.png
        buildPhase: resources
      - path: Assets/cat_success.png
        buildPhase: resources
      - path: Assets/cat_fail.png
        buildPhase: resources
      - path: Assets/cat_think_long.png
        buildPhase: resources
    dependencies:
      - target: petsend
        embed: false
    postCompileScripts:
      - name: "Embed petsend CLI"
        script: |
          set -e
          mkdir -p "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources"
          cp "$BUILT_PRODUCTS_DIR/petsend" "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/petsend"
          chmod +x "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/petsend"
        inputFiles:
          - $BUILT_PRODUCTS_DIR/petsend
        outputFiles:
          - $BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/petsend
    info:
      path: Generated/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: ClaudePet
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewtucker.ClaudePet
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
  petsend:
    type: tool
    platform: macOS
    sources:
      - path: Sources/petsend
    settings:
      base:
        PRODUCT_NAME: petsend
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
